name: Build Arrow Duel APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: unzip ArrowDuel_Fresh_Project.zip -d source

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d $HOME

      - name: Build APK
        run: $HOME/gradle-8.9/bin/gradle -p source assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowDuel-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
